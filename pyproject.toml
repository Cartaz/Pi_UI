[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pi-ui"
version = "0.1.0.dev0"
description = "Desktop AI OS shell around Pi Agent with LAN inference"
requires-python = ">=3.12"
dependencies = ["PySide6>=6.11,<7"]

[project.scripts]
pi-ui = "main:main"

[project.optional-dependencies]
test = ["pytest>=8.3,<10"]

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["controllers*", "core*", "ui*"]

[tool.setuptools.package-data]
ui = ["qml/PiUI/*.qml", "qml/PiUI/qmldir"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
