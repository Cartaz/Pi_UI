name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app-tests:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[test]'
      - name: Compile Python sources
        run: python -m compileall -q controllers core ui tests main.py
      - name: Lint QML syntax imports and warnings
        run: pyside6-qmllint --max-warnings 0 -I ui/qml ui/qml/PiUI/*.qml
      - name: Run tests including offscreen QML smoke
        run: python -m pytest
